[package]
name = "chronos-ledger"
version = "0.1.0"
edition = "2021"
description = "Embeddable emit-client for the Chronos accountability ledger: fire structured, per-action events at the privileged sink over a Unix datagram socket. No keys, no crypto, non-blocking."
license = "GPL-3.0-or-later OR LicenseRef-Commercial"

[lib]
name = "chronos_ledger"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[example]]
name = "emit"
path = "examples/emit.rs"
