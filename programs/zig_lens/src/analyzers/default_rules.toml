# zig_lens scanner — default ruleset.
#
# Each [[rule]] table is one detection. The fields below are documented
# in `analyzers/rule_engine.zig` (RuleKind / Confidence / Rule struct).
#
# Confidence + gate combine to determine CI behavior:
#   confidence = "high"   + gate = true    → counted toward --strict
#                                            (fatal exit 2 if matched)
#   confidence = "high"   + gate = false   → printed as WARN, advisory
#   confidence = "medium" or "low"         → printed as WARN, never fatal
#                                            (advisory regardless of gate)
#
# The 4 anti-patterns established by the JSON-IN-FMT / SHELL-CHILD /
# EQL-FOR-SECRETS / MBEDTLS-VERIFY-NONE purge are encoded as 5 rule
# entries below (SHELL-CHILD has two complementary shapes — the
# enclosing-fn /bin/sh form and the same-line sh+ -c argv pair).
#
# Patterns using `[ ... ]` arrays are TOML literal strings (single
# quotes): bytes are taken as-is, no escape processing. That keeps the
# JSON-shape markers ({{\", \":\", etc.) readable.

# ---------------------------------------------------------------------
# JSON-IN-FMT — Hand-formatted JSON in printf-style format strings.
# ---------------------------------------------------------------------
[[rule]]
id              = "JSON-IN-FMT"
summary         = "Hand-formatted JSON in printf-style format strings"
severity        = "high"
confidence      = "high"
gate            = true
kind            = "line_match"
message         = "allocPrint/bufPrint used to build JSON — hand-formatted JSON does not escape interpolated values (use std.json.Stringify)"
contains_ident_any    = ["allocPrint", "bufPrint"]
window_lines          = 4
window_contains_any   = ['{{\"', '\":\"', '\":{', ',\"']
covers          = """
allocPrint / bufPrint where the format string contains JSON
shape markers ({{\"…\":\"…\"}}, \":[, etc.).
"""
does_not_cover  = """
Hand-built SQL (\"WHERE id={s}\"), XML, YAML, URL path segments,
HTML, shell-command strings outside std.process.Child, JSON
construction through std.ArrayList.appendSlice + literals
(\"\\\"name\\\":\\\"\" then escape-less write), or any other
structured format. Each is a sibling injection class that
needs its own rule. A green JSON-IN-FMT scan does NOT mean
injection-safe.
"""

# ---------------------------------------------------------------------
# MBEDTLS-VERIFY-NONE — mbedTLS cert validation disabled by literal flag.
# ---------------------------------------------------------------------
[[rule]]
id              = "MBEDTLS-VERIFY-NONE"
summary         = "mbedTLS certificate validation disabled by literal flag"
severity        = "critical"
confidence      = "high"
gate            = true
kind            = "line_match"
message         = "MBEDTLS_SSL_VERIFY_NONE disables certificate validation — never use in production"
contains_any    = ["MBEDTLS_SSL_VERIFY_NONE"]
covers          = """
Any source line referencing the MBEDTLS_SSL_VERIFY_NONE token
(outside of comments and multi-line string fixtures).
"""
does_not_cover  = """
Equivalent disablements via numeric literal 0 passed to
mbedtls_ssl_conf_authmode, custom verify callbacks that
always return 0, or runtime config that selects VERIFY_NONE
indirectly (e.g. through an env-var-driven int). Also
language-specific equivalents in OpenSSL / LibreSSL / Rust
rustls / Go crypto/tls (InsecureSkipVerify) — none scanned.
"""

# ---------------------------------------------------------------------
# EQL-FOR-SECRETS — Non-constant-time comparison in auth-context functions.
# ---------------------------------------------------------------------
[[rule]]
id              = "EQL-FOR-SECRETS"
summary         = "Non-constant-time comparison in auth-context functions"
severity        = "high"
confidence      = "high"
gate            = true
kind            = "enclosing_fn"
message         = "non-constant-time comparison in a function whose name or parameters identify a secret — use std.crypto.timing_safe.eql or security.constantTimeEql"
contains_any    = ["std.mem.eql"]
contains_ident_any        = ["memcmp"]
not_contains_ident_any    = ["constantTimeEql", "timing_safe"]
require_secret_function   = true
covers          = """
std.mem.eql / memcmp called within a function whose NAME or
PARAMETER list contains a recognized secret. Token matching
splits identifiers on camelCase and snake_case boundaries:

  Single sub-tokens (case-insensitive equality):
    signature, hmac, password, passwd, secret, nonce, apikey

  Adjacent sub-token pairs:
    api/key, session/token, auth/token, bearer/token, csrf/token,
    access/token, refresh/token, verify/token, id/token
"""
does_not_cover  = """
Auth-context functions whose identifiers don't contain a
keyword (e.g. `compare`, `validate`, `checkBearer` — Bearer
alone is not in the set). Comparisons through indirection
(function A calls helper B which does the eql). Hand-rolled
loops over byte arrays. Comparisons via the `!=` operator
on slices. Cross-file flow (the eql is in a different file
than the function whose name signals the secret context).
For these the gate cannot replace human review.
"""

# ---------------------------------------------------------------------
# SHELL-CHILD (a) — /bin/sh literal in an enclosing function that
# also calls a process-spawn primitive.
# ---------------------------------------------------------------------
[[rule]]
id              = "SHELL-CHILD"
summary         = "Shell invocation in argv-mode process spawn"
severity        = "critical"
confidence      = "high"
gate            = true
kind            = "enclosing_fn_with_body"
message         = "process.Child / process.run / execve invoked via /bin/sh — argv-mode exec exists specifically to avoid shell metacharacter injection"
contains_any    = ['"/bin/sh"', '"/bin/bash"', '"/usr/bin/env"']
require_spawn_in_function = true
covers          = """
Literal \"/bin/sh\" or \"/bin/bash\" string appearing in the body
of a function that also references std.process.Child /
process.run / Child.init / execve / execvp / system. Plus
the \"sh\"+\"-c\" or \"bash\"+\"-c\" literal pair on the same argv
line (independent of enclosing function).
"""
does_not_cover  = """
Shell invocations via $SHELL / getenv(\"SHELL\") indirection
(the literal \"/bin/sh\" never appears in source). argv[0]
bound to a runtime-discovered binary that happens to be a
shell. popen / posix_spawn / system() / Rust
Command::new(\"sh\") if not preceded by \"/bin/sh\" literal.
Cross-function flow where the argv is built in one fn and
spawned in another.
"""

# ---------------------------------------------------------------------
# SHELL-CHILD (b) — "sh" / "bash" + "-c" both present on the same
# argv-array line. Independent of enclosing-function scope because
# the pair itself is a strong signal.
# ---------------------------------------------------------------------
[[rule]]
id              = "SHELL-CHILD"
summary         = "Shell -c pair on argv line"
severity        = "critical"
confidence      = "high"
gate            = true
kind            = "line_groups"
message         = "shell -c pattern in argv — re-introduces metacharacter injection that argv-mode exec was designed to prevent"
line_groups     = [
  ['"sh"', '"bash"', '"zsh"'],
  ['"-c"'],
]
covers          = """
Same-line argv literal where one element is a shell binary
(\"sh\" / \"bash\" / \"zsh\") and another is \"-c\". This is the
shape that pipes the next argument to a shell parser.
"""
does_not_cover  = """
Multi-line argv-array construction where the shell binary
and \"-c\" appear on different source lines (the engine looks
only at the same line for this rule). Shell invocations
via the (a) form above (covered separately).
"""

# ---------------------------------------------------------------------
# CATCH-UNREACHABLE — `catch unreachable` converts a recoverable
# error into an immediate process abort. Forbidden on any code path
# that handles hostile input (parsers, network clients, crypto, FFI
# surfaces) — the error MUST propagate via !T so the caller decides.
# ---------------------------------------------------------------------
[[rule]]
id              = "CATCH-UNREACHABLE"
summary         = "catch unreachable converts a recoverable error into a process crash"
severity        = "critical"
confidence      = "high"
gate            = true
kind            = "line_match"
message         = "catch unreachable aborts the host process on any non-panic error path — propagate via !T instead"
contains_any    = ["catch unreachable"]
covers          = """
Any line containing the literal token pair `catch unreachable`.
In parsers, network clients, crypto, FFI surfaces, or anywhere a
hostile input can reach: an unexpected error MUST be propagated
via `!T` so the caller decides how to handle it. catch
unreachable turns that into a UB-flavored abort that kills the
whole host process — including any unrelated requests being
served concurrently.
"""
does_not_cover  = """
`catch return null`, `catch return defaultValue`, `catch |err| ...`
with an explicit error handler — those are intentional. Inside a
comptime block, `catch unreachable` is sometimes provably safe
(the call cannot fail at comptime by construction); this rule
still flags those and they need an inline zig-lens-ignore with
reason text. Equivalent patterns via std.debug.panic / @panic /
std.process.exit on an error path are NOT scanned and need
human review.
"""

# ---------------------------------------------------------------------
# ASSUME-CAPACITY — ArrayList's *AssumeCapacity family bypasses
# bounds checks. Safe usage requires a preceding ensureTotalCapacity
# AND an auditable invariant that the buffer cannot be filled past
# that capacity before the AssumeCapacity write. We've shipped
# silent buffer overflows from violating exactly that.
# ---------------------------------------------------------------------
[[rule]]
id              = "ASSUME-CAPACITY"
summary         = "ArrayList *AssumeCapacity methods bypass bounds checking"
severity        = "high"
confidence      = "high"
gate            = true
kind            = "line_match"
message         = "AssumeCapacity methods write past end-of-buffer when the invariant doesn't hold — prefer .append(allocator, …) or pair ensureTotalCapacity with an audited invariant"
contains_ident_any = ["appendAssumeCapacity", "appendSliceAssumeCapacity", "addOneAssumeCapacity", "insertAssumeCapacity", "writeAssumeCapacity"]
covers          = """
Any call to an *AssumeCapacity* ArrayList method. These methods
do NOT re-allocate on overflow — they write past the buffer end
and trigger undefined behavior. Safe usage requires a preceding
ensureTotalCapacity (or ensureUnusedCapacity) call AND an
auditable invariant that the buffer cannot be filled past that
capacity between the ensure call and the AssumeCapacity write.
"""
does_not_cover  = """
Manual byte-array writes that perform the same bypass without
going through ArrayList (raw pointer arithmetic, @memcpy past
end-of-buffer). Cross-function flow where the ensureTotalCapacity
is in caller A and the AssumeCapacity is in callee B (the
scanner sees only the call site, not the data flow). Stack-
buffer writes via std.fmt.bufPrint when the buffer is too small
(those return NoSpaceLeft, but only if checked).
"""

# ---------------------------------------------------------------------
# NAKED-POINTER-CAST — @ptrCast / @ptrFromInt / @intToPtr in
# application code. Sometimes unavoidable in FFI / drivers / MMIO
# but each occurrence in application logic hides type-confusion and
# alignment bugs. Advisory only — the rule fires as WARN, never
# blocks --strict, because the cast is sometimes legitimate.
# ---------------------------------------------------------------------
[[rule]]
id              = "NAKED-POINTER-CAST"
summary         = "Pointer cast / int-to-pointer conversion in application code"
severity        = "medium"
confidence      = "medium"
gate            = false
kind            = "line_match"
message         = "advisory: @ptrCast / @ptrFromInt / @intToPtr hides type-confusion and alignment bugs — confirm this is genuinely FFI / driver / MMIO and not application logic"
contains_any    = ["@ptrCast", "@ptrFromInt", "@intToPtr"]
covers          = """
Any source line containing one of the pointer-cast builtins
@ptrCast, @ptrFromInt, or the legacy @intToPtr (which Zig 0.11+
replaced with @ptrFromInt — still flagged for any pre-0.11
files that may have escaped a migration).
"""
does_not_cover  = """
@bitCast on pointer values (a different builtin with the same
risk profile, currently un-scanned). @alignCast — also pointer-
related but expresses a narrowing alignment guarantee.
Cross-function flow where the cast is in a helper and the
unsafe call lives elsewhere. Pointer arithmetic via raw integer
math without a dedicated builtin (extremely rare in idiomatic
Zig).
"""

# ---------------------------------------------------------------------
# FLOAT-OBSESSION — Raw f32/f64 used for a quantity that should be a
# typed Quantity(UnitTag) (Mars Climate Orbiter) or an integer tick
# counter / base-unit integer (Patriot missile). Advisory; flags
# proximity of a float type to identifier names that look financial,
# temporal, or quantity-bearing. See RESILIENCE_PATTERNS.md (the MCO
# Rule + the Patriot Rule) for the structural fix.
# ---------------------------------------------------------------------
[[rule]]
id                  = "FLOAT-OBSESSION"
summary             = "Raw f32/f64 near a temporal or quantity identifier"
severity            = "medium"
confidence          = "medium"
gate                = false
kind                = "line_match"
message             = "advisory: raw f32/f64 near a time/balance/quantity identifier — consider Quantity(UnitTag) (MCO Rule) or u64 ticks / base-unit integer (Patriot Rule). See RESILIENCE_PATTERNS.md."
contains_ident_any  = ["f32", "f64"]
window_lines        = 0
window_contains_any = [
  "time", "Time",
  "clock", "Clock",
  "tick", "Tick",
  "balance", "Balance",
  "amount", "Amount",
  "price", "Price",
  "qty", "Qty",
  "quantity", "Quantity",
]
covers              = """
Any line declaring or accepting an f32/f64 whose surrounding
identifier text (same line) suggests a physical / financial /
temporal quantity. Catches the most common shape of the MCO bug
(unit-bearing value in a raw float) and the Patriot bug (clock
or balance accumulator in a float that drifts).
"""
does_not_cover      = """
Quantities whose identifier name is not a tell (e.g. `bias`,
`offset`, `delta`, `error_term`, `loss`, `nav_state`). Anywhere
a calculation produces a temporary f64 with no obvious name.
Storage in fields whose type is a typedef hiding f64. The
control-loop bug shape where the float lives in a struct field
declared in another file. See RESILIENCE_PATTERNS.md for the
broader rule.
"""

# ---------------------------------------------------------------------
# BLIND-CAST — Bare @intCast / @floatCast / @intFromFloat /
# @ptrFromInt on the same line, without any visible bounds check or
# .len logic. Advisory. The structurally safer pattern is
# std.math.cast(T, v) which returns ?T and forces the caller to
# handle overflow. See RESILIENCE_PATTERNS.md — the Ariane Rule.
# ---------------------------------------------------------------------
[[rule]]
id              = "BLIND-CAST"
summary         = "Narrowing cast without an obvious bounds check (Ariane 5 shape)"
severity        = "medium"
confidence      = "medium"
gate            = false
kind            = "line_match"
message         = "advisory: @intCast / @floatCast / @intFromFloat without a visible bounds check — prefer std.math.cast(T, x) (returns ?T) or guard with an explicit range check (Ariane Rule)."
contains_any    = ["@intCast", "@floatCast", "@intFromFloat"]
# Suppress when the same line already shows a checked cast or
# bounds-style logic. These substrings are NOT identifiers, so we
# use not_contains_any (substring), not not_contains_ident_any.
not_contains_any = [
  "std.math.cast",
  "std.math.maxInt",
  "std.math.minInt",
  ".len",
  "@min",
  "@max",
]
covers          = """
@intCast / @floatCast / @intFromFloat on a line that does not
also reference std.math.cast, std.math.maxInt/minInt, .len, or
@min/@max. This is the Ariane 5 shape: a narrowing conversion
with no observable range check.
"""
does_not_cover  = """
Casts whose bounds check is in the caller (cross-function flow),
in a helper above (cross-line flow), or expressed through a
hand-written `if (x > MAX) ...` whose pattern doesn't match the
trigger set. @ptrFromInt / @intToPtr — covered separately by
NAKED-POINTER-CAST. @as(...) coercions that the compiler can
prove safe at comptime. Inside a comptime block where the input
is a literal.
"""
