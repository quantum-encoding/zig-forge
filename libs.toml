# Libraries other repos link from this checkout.
#
# `scripts/build-consumed-libs.sh` builds every row (or the rows it is named), and is the
# one command for producing them. Each row is a contract with its consumers:
#
#   name       the input name consumers use for it in their release.toml
#   dir        the program directory; scripts/zig-source-id.sh <dir> is the identity in
#              the `-source-id.txt` stamp beside each artifact
#   build      the command that builds it, run from the repo root. A consumer's
#              release.toml must declare this exact string: `baton release` hashes it into
#              the input's identity.
#   artifacts  what the build produces, repo-relative. An archive in its program's zig-out/lib/ is
#              written only by that program's `zig build lib` step, in a release mode; plain
#              `zig build` installs under zig-out/lib/dev/, so it never replaces a stamped one.
#   sources    what a consumer's release.toml must declare as `sources` (array form),
#              repo-relative. It covers the program dir, every directory its build
#              reaches into (scripts/zig-source-id.sh --deps <dir>), and the build scripts.
#   consumers  `baton release` products whose release.toml declares this input; the build
#              stamps it for each of them (<artifact>.release-stamp.json)
#   notes      who else links it, and how
#
# Format: only `[[lib]]` tables whose values are single-line strings or single-line
# arrays of strings. The build script parses exactly that and refuses anything else.

[[lib]]
name      = "quantum_crypto"
dir       = "programs/simd_crypto_ffi"
build     = "scripts/build-macos-lib.sh programs/simd_crypto_ffi"
artifacts = ["programs/simd_crypto_ffi/zig-out/lib/libquantum_crypto.a"]
sources   = ["programs/simd_crypto_ffi", "scripts/build-macos-lib.sh", "scripts/zig-toolchain.sh"]
consumers = ["cosmic-duck-os"]
notes     = "Also CryptoWalletKit and Cifra (scripts/check-zig-slices.sh compares the -source-id.txt stamp); iOS slices come from programs/build-ios-libs.sh."

[[lib]]
name      = "zterm_plex"
dir       = "programs/zterm_plex"
build     = "scripts/build-macos-lib.sh programs/zterm_plex"
artifacts = ["programs/zterm_plex/zig-out/lib/libzterm_plex.a", "programs/zterm_plex/zig-out/lib/libterminal_mux.a"]
sources   = ["programs/zterm_plex", "scripts/build-macos-lib.sh", "scripts/zig-toolchain.sh"]
consumers = ["cosmic-duck-os", "aiconductor"]
notes     = "Formerly terminal_mux: programs/terminal_mux is a link to programs/zterm_plex, terminal_mux.h includes zterm_plex.h, and the lib step also installs libterminal_mux.a, so consumers still on the old names build unchanged until they move. aiconductor's Xcode Run Script runs programs/terminal_mux/scripts/ensure-fresh-lib.sh, which rebuilds with this command when the stamp does not match. rust_agent's agent-ffi/ensure-fresh-lib.sh calls that script too."

[[lib]]
name      = "zig_docx"
dir       = "programs/zig_docx"
build     = "scripts/build-macos-lib.sh programs/zig_docx"
artifacts = ["programs/zig_docx/zig-out/lib/libzig_docx.a"]
sources   = ["programs/zig_docx", "scripts/build-macos-lib.sh", "scripts/zig-toolchain.sh"]
consumers = ["cosmic-duck-os"]
notes     = "programs/zig_docx/build-libs.sh release runs the same command."

[[lib]]
name      = "zigpdf"
dir       = "programs/zig_pdf_generator"
build     = "scripts/build-macos-lib.sh programs/zig_pdf_generator"
artifacts = ["programs/zig_pdf_generator/zig-out/lib/libzigpdf.a"]
sources   = ["programs/zig_pdf_generator", "programs/zig-quantum-encryption/src", "programs/zig_docx/src", "programs/zig_legend/src", "programs/zig_toml/src", "scripts/build-macos-lib.sh", "scripts/zig-toolchain.sh"]
consumers = ["cosmic-duck-os"]
notes     = "build.zig imports ML-DSA, zig_docx, zig_legend and zig_toml from sibling programs. programs/zig_pdf_generator/build-libs.sh release runs the same command."

[[lib]]
name      = "zsss"
dir       = "zig_core_utils/zsss"
build     = "scripts/build-zsss.sh"
artifacts = ["zig_core_utils/zsss/zig-out/lib/libzsss-aarch64-macos.a", "zig_core_utils/zsss/zig-out/lib/libzsss-aarch64-ios.a", "zig_core_utils/zsss/zig-out/lib/libzsss-aarch64-ios-simulator.a", "zig_core_utils/zsss/zig-out/lib/libzsss-aarch64-android.a", "zig_core_utils/zsss/zig-out/lib/libzsss-arm-android.a", "zig_core_utils/zsss/zig-out/lib/libzsss-x86_64-android.a", "zig_core_utils/zsss/zig-out/lib/libzsss-x86-android.a", "zig_core_utils/zsss/zig-out/lib/zsss-x86_64-windows.lib", "zig_core_utils/zsss/zig-out/lib/libzsss-aarch64-android.so", "zig_core_utils/zsss/zig-out/lib/libzsss-arm-android.so", "zig_core_utils/zsss/zig-out/lib/libzsss-x86_64-android.so", "zig_core_utils/zsss/zig-out/lib/libzsss-x86-android.so"]
sources   = ["zig_core_utils/zsss", "scripts/build-zsss.sh", "scripts/zig-toolchain.sh"]
consumers = ["cosmic-duck-os"]
notes     = "ReleaseFast (fixed in zsss's build.zig per target). The same build writes the iOS, simulator and Linux archives Cifra and Tessera link; the iOS and simulator ones Cifra links are artifacts here so their stamps and links are checked too (437F922C), as are the four Android static archives, the Windows MSVC .lib and the four Android shared libraries quantum_vault vendors under src-tauri/libs/ (the .so files need an Android NDK: build-zsss.sh finds it through ANDROID_NDK_HOME and fails without one). Cifra's check-zig-slices.sh compares their stamps and links each."

[[lib]]
name      = "chronos_ledger"
dir       = "programs/cognitive_telemetry_kit/chronos-ledger"
build     = "programs/cognitive_telemetry_kit/chronos-ledger/swift/build-apple-lib.sh"
artifacts = ["programs/cognitive_telemetry_kit/chronos-ledger/swift/Vendor/libchronos_ledger.a"]
sources   = ["programs/cognitive_telemetry_kit/chronos-ledger", "programs/zig-quantum-encryption/src", "scripts/build-macos-lib.sh", "scripts/zig-toolchain.sh"]
consumers = ["cosmic-duck-os", "aiconductor"]
notes     = "Signs with ML-DSA from programs/zig-quantum-encryption/src (build.zig imports it), so a change there stales this archive."

[[lib]]
name      = "zdedupe"
dir       = "programs/zdedupe"
build     = "scripts/build-macos-lib.sh programs/zdedupe ReleaseFast"
artifacts = ["programs/zdedupe/zig-out/lib/libzdedupe.a"]
sources   = ["programs/zdedupe", "scripts/build-macos-lib.sh", "scripts/zig-toolchain.sh"]
consumers = ["zdedupe"]
notes     = "tauri_apps/zdedupe links vendored copies its scripts/vendor-core.sh builds from one zig-forge commit (ReleaseFast); this row proves the program builds from a clean checkout in that mode, and its stamp is what zdedupe's inputs-fresh gate reads."

[[lib]]
name      = "endpoint_sec"
dir       = "programs/zig_endpoint_sec"
build     = "scripts/build-macos-lib.sh programs/zig_endpoint_sec ReleaseFast"
artifacts = ["programs/zig_endpoint_sec/zig-out/lib/libes_core_zig.a", "programs/zig_endpoint_sec/zig-out/lib/libendpoint_sec.a"]
sources   = ["programs/zig_endpoint_sec", "programs/zig_darwin_kit", "scripts/build-macos-lib.sh", "scripts/zig-toolchain.sh"]
consumers = []
notes     = "MetatronSecurity's es-core/build.sh builds and copies libes_core_zig.a itself (`zig build -Doptimize=ReleaseFast xcode`, which writes zig-out/lib/xcode/); this row proves the program builds from a clean checkout in that mode."

[[lib]]
name      = "memory_pool_core"
dir       = "programs/memory_pool"
build     = "scripts/build-macos-lib.sh programs/memory_pool"
artifacts = ["programs/memory_pool/zig-out/lib/libmemory_pool_core.a"]
sources   = ["programs/memory_pool", "scripts/build-macos-lib.sh", "scripts/zig-toolchain.sh"]
consumers = []
notes     = "quantum_vault links it from this checkout (src-tauri/build.rs: zig-out/lib on desktop, android-arm64/ from programs/build-android-libs.sh, ios-libs/ from programs/build-ios-libs.sh) and fails its build when the -source-id.txt beside the archive names a source this checkout no longer holds. It is not a baton release product, so no release stamp is written."
